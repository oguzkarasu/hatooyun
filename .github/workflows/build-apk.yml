name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dosyalari duzenle
        run: |
          mkdir -p www/icons
          cp index.html manifest.json sw.js cover.jpg cover-art.png www/
          cp icon-192.png icon-512.png maskable-192.png maskable-512.png wide.jpg www/icons/

      - name: Paketleri kur
        run: npm install

      - name: three.js dosyasini uygulamanin icine koy
        run: |
          npm install --no-save three@0.128.0 || true
          if [ -s node_modules/three/build/three.min.js ]; then
            cp node_modules/three/build/three.min.js www/three.min.js
            sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
          fi

      - name: Android projesini olustur
        run: |
          npx cap add android
          pip install pillow
          python3 make_icons.py
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hatoya-kosuyorum-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
